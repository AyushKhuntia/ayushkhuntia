<svg viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ayush Khuntia banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E9EF7"/>
      <stop offset="100%" stop-color="#6DD5FA"/>
    </linearGradient>
    <style>
      .name { font-family: Verdana, Geneva, sans-serif; font-weight: 700; font-size: 54px; fill: #ffffff; opacity: 0; animation: fadeIn 1.2s ease-out 0.1s forwards; }
      .tagline { font-family: Verdana, Geneva, sans-serif; font-weight: 400; font-size: 19px; fill: #eaf6ff; opacity: 0; animation: fadeIn 1.2s ease-out 0.5s forwards; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>

  <path d="M0,150 C200,190 400,110 600,140 C800,170 1000,120 1200,150 L1200,220 L0,220 Z" fill="rgba(255,255,255,0.14)"/>
  <path d="M0,170 C250,130 450,200 700,160 C900,130 1050,180 1200,160 L1200,220 L0,220 Z" fill="rgba(255,255,255,0.22)"/>

  <text x="600" y="95" text-anchor="middle" class="name">Ayush Khuntia</text>
  <text x="600" y="130" text-anchor="middle" class="tagline">Backend Developer · Java &amp; Spring Boot · System Design</text>
</svg>
